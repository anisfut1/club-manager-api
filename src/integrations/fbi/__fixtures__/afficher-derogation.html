<html>
  <body>
    <h1>Détail de la dérogation</h1>
    <!--
      Reproduit fidèlement le HTML SOURCE réel de afficherDerogation.fbi,
      fourni par le club le 2026-09-25 (deux exemples réels distincts,
      mêmes id de champ sur les deux) — jamais une capture d'écran seule
      cette fois. Champs réels : <input disabled>/<textarea readonly>,
      chacun avec un id STABLE (demandeurLibelle, motif, dateDerogation,
      horaireHour, adversaire, reponseAdversaireDate, acceptation,
      motifRefus). id="dateDerogation" existe en DOUBLE dans le vrai FBI
      (le <div> englobant ET l'<input> à l'intérieur) — reproduit ici
      volontairement pour vérifier que le code cible bien
      input#dateDerogation, jamais juste #dateDerogation.
    -->
    <form id="afficherDerogation">
      <input type="hidden" id="idDerogation" value="1k+JhfgiN4lc" />

      <div class="row sousTitre"><p>Généralités</p></div>
      <input type="text" id="rencontreEquipeDomicile" value="SPORT CLUB DE SETE BASKET - 1" disabled="disabled" />
      <input type="text" id="rencontreEquipeVisiteur" value="CASTELNAU BASKET - 2" disabled="disabled" />
      <input type="text" id="rencontreDateRencontre" value="26/09/2026" disabled="disabled" />
      <input type="text" id="rencontreDateDerogation" value="" disabled="disabled" />
      <input type="text" id="rencontreHeure" value="15:30" disabled="disabled" />

      <div class="row sousTitre"><p>Demande de dérogation</p></div>
      <input type="text" id="demandeurLibelle" value="Domicile" disabled="disabled" />
      <input type="text" id="dateDepot" value="19/08/2026 17:42" disabled="disabled" />
      <div id="dateDerogation" style="margin-top:-15px;">
        <input type="text" id="dateDerogation" value="03/10/2026" disabled="disabled" />
      </div>
      <input type="text" id="horaireHour" value="20:00" disabled="disabled" />
      <textarea id="motif" readonly="readonly">Gymnase indisponible ce jour-là</textarea>

      <div class="row sousTitre"><p>Réponse de l'adversaire</p></div>
      <input type="text" id="adversaire" value="CASTELNAU BASKET" disabled="disabled" />
      <input type="text" id="reponseAdversaireDate" value="" disabled="disabled" />
      <input type="text" id="acceptation" value="" disabled="disabled" />
      <textarea id="motifRefus" readonly="readonly"></textarea>
    </form>
  </body>
</html>
