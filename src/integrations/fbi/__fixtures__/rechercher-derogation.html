<html>
  <body>
    <h1>Recherche de dérogation</h1>
    <!--
      Reproduit fidèlement le HTML RÉEL de rechercherDerogation.fbi, fourni
      par le club le 2026-09-25 après un premier test en production qui ne
      renvoyait QUE des lignes "A Créer" (voir docs/FBI.md, §"Bug corrigé
      le 2026-09-25 (deuxième round)"). Deux points RÉELS confirmés qui
      manquaient à la version précédente de cette fixture :
      1. Le `<label>` "Etat de la dérogation" est un FRÈRE du `<select>`,
         jamais son parent — d'où le sélecteur par attribut `name` côté
         browser-client.ts, jamais par libellé englobant.
      2. Les vraies valeurs d'option sont CREER/EC/ACCEPT/ORGCREACC/
         ORGCREREF/TT (jamais A_CREER/EN_COURS/... inventées avant d'avoir
         le vrai HTML) — le code ne les code jamais en dur, mais cette
         fixture doit les reproduire pour que le test soit fidèle.
      Le bouton RECHERCHER est `type="button"` (soumission AJAX réelle, la
      page ne navigue JAMAIS — `rechercherDerogationAjax()` injecte le
      résultat dans #getTableauDerogation) : reproduit ici par un script
      minimal, jamais un vrai appel réseau.

      3. Ligne de résultat réelle fournie par le club le 2026-09-25 (outerHTML
         d'un `<tr>` copié depuis le VRAI FBI, "ca marche tjr pas les motifs
         etc") : la 1ère `<td>` est une checkbox
         (`class="FBICheckbox rechercheCheckBox"`, JAMAIS un lien), et CHAQUE
         cellule de donnée qui suit enveloppe son texte dans
         `<div class="alignCentrer"><a href="afficherDerogation.fbi?idDerogation=...&idRencontre=0">...</a></div>`
         — un VRAI lien HTML statique, jamais un `onclick` ni un gestionnaire
         JS attaché en ligne. C'est ce lien qu'exploite
         `derogationRowDetailHref` (browser-client.ts) pour ouvrir le détail
         dans un NOUVEL onglet, sans jamais cliquer/naviguer sur CETTE page
         (voir le commentaire au-dessus de `fetchDerogationDetailByHref`).

      4. "si si il prend tout en compte le tous les états, c juste que ya 5
         pages à prendre en compte" (club, 2026-09-27, après un round
         intermédiaire qui avait cru "Tous les états" (TT) incomplet pour
         "En Cours" et "Acceptée par les deux associations sportives") —
         `TT` couvre RÉELLEMENT tous les états (sauf "A Créer"), la vraie
         cause était une PAGINATION incomplète. `PAGE_SIZE = 2` ci-dessous
         force artificiellement plusieurs pages (3 rencontres non-"A
         Créer" → 2 pages) pour reproduire fidèlement ce scénario en test,
         avec une VRAIE pagination "Suivant"/"Précédent" cliquable (jamais
         `href="#"` inerte) — voir `collectAllDerogationsWithDetail`
         (browser-client.ts) et `waitForStableDerogationTable`.
    -->
    <form id="rechercherDerogation">
      <div class="row">
        <select name="rechercheDerogationForm.rechercheDerogationBean.idTypeDemande" id="listeType">
          <option value="">Choisir...</option>
          <option value="1">Modifier la date</option>
        </select>
        <label class="active ml-4 mt-2">Type de demande</label>
      </div>
      <div class="row">
        <select name="rechercheDerogationForm.rechercheDerogationBean.etatDerogation" id="idEntite">
          <option value="CREER">A Créer</option>
          <option value="EC">En Cours</option>
          <option value="ACCEPT">Acceptée par les deux associations sportives</option>
          <option value="ORGCREACC">Acceptée par l'organisme dirigeant</option>
          <option value="ORGCREREF">Refusée</option>
          <option value="TT" selected="selected">Tous les états (sauf à créer)</option>
        </select>
        <label class="active ml-4 mt-2">Etat de la dérogation</label>
      </div>
      <div class="row">
        <input type="text" name="rechercheDerogationForm.rechercheDerogationBean.numeroRencontre" value="" id="rechercheDerogationFormNumeroRencontre" />
        <label for="rechercheDerogationFormNumeroRencontre" class="textRightLabel">Numéro de rencontre</label>
      </div>
      <div class="row">
        <button id="rechercher" type="button" onclick="rechercherDerogationAjax()">RECHERCHER</button>
      </div>
    </form>

    <div id="tableauResultats" style="display:none">
      <table id="getTableauDerogation">
        <thead>
          <tr>
            <th></th>
            <th>Date de dépôt</th>
            <th>N° Renc</th>
            <th>Division</th>
            <th>Domicile</th>
            <th>Visiteur</th>
            <th>Date rencontre</th>
            <th>Heure</th>
            <th>Date déro</th>
            <th>Etat de la dérogation</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <!--
        Pagination DataTables RÉELLE — outerHTML du bouton "Suivant" fourni
        par le club le 2026-09-27, reproduit ici EXACTEMENT :
        <a class="paginate_button next" aria-controls="rechercherDerogationAjax"
           data-dt-idx="6" tabindex="0" id="rechercherDerogationAjax_next">Suivant</a>
        AUCUN `href` — un `<a>` sans `href` n'a aucun rôle ARIA "link"
        implicite, d'où le bug corrigé côté selectors.ts
        (`nextPageControl`) : `getByRole("link", ...)` ne pouvait jamais le
        trouver. Cherché maintenant par classe `paginate_button` (confirmée
        réelle), jamais par rôle seul.
      -->
      <div class="dataTables_paginate">
        <a class="paginate_button previous" tabindex="0" id="rechercherDerogationAjax_previous" onclick="return changerPage(-1);">Précédent</a>
        <span><a class="paginate_button current" tabindex="0" id="paginateCurrentPage">1</a></span>
        <a class="paginate_button next" aria-controls="rechercherDerogationAjax" data-dt-idx="6" tabindex="0" id="rechercherDerogationAjax_next" onclick="return changerPage(1);">Suivant</a>
      </div>
    </div>

    <script>
      // Reproduit rechercherDerogationAjax() : lit le formulaire côté client
      // (jamais un vrai appel réseau ici), injecte les lignes correspondant
      // au filtre "Etat de la dérogation" et au "Numéro de rencontre"
      // ACTUELLEMENT sélectionnés — comme le fait jQuery.serialize() sur le
      // vrai FBI, ce qui valide que le code de production modifie bien le
      // <select> AVANT de cliquer, jamais après.
      // `cells` : les 9 colonnes de DONNÉES (Date de dépôt → Etat), jamais
      // la colonne checkbox (col 0), construite séparément ci-dessous — même
      // découpage que la ligne réelle fournie par le club.
      const ALL_ROWS = [
        {
          numero: "1",
          etat: "ORGCREACC",
          etatLabel: "Acceptée par l'organisme dirigeant",
          cells: ["19/08/2026 17:42", "1", "BU13FN23", "SPORT CLUB DE SETE BASKET - 1", "CASTELNAU BASKET - 2", "26/09/2026", "15:30", "", "Acceptée par l'organisme dirigeant"],
          detailUrl: "afficherDerogation.fbi?idDerogation=1k%2BJhfgiN4lc&idRencontre=0",
        },
        {
          numero: "9578",
          etat: "ORGCREACC",
          etatLabel: "Acceptée par l'organisme dirigeant",
          cells: ["20/08/2026 07:47", "9578", "DM2", "LES LOUPS DU PIC OCCIDENTAL BASKET - 1", "IE - SPORT CLUB DE SETE BASKET - 2", "24/04/2027", "20:30", "", "Acceptée par l'organisme dirigeant"],
          detailUrl: "afficherDerogation.fbi?idDerogation=FGzH5N295hQh&idRencontre=0",
        },
        {
          numero: "2659",
          etat: "CREER",
          etatLabel: "A Créer",
          cells: ["", "2659", "PRF", "OUEST MONTPELLIER METROPOLE BASKET - 3", "SPORT CLUB DE SETE BASKET - 1", "07/11/2026", "18:30", "", "A Créer"],
          detailUrl: "afficherDerogation.fbi?idDerogation=xuFqkhFXKcVOZPHKMXZhbQ&idRencontre=0",
        },
        {
          numero: "9820",
          etat: "EC",
          etatLabel: "En Cours",
          cells: ["14/09/2026 14:55", "9820", "PRF", "MONTPELLIER BASKET MOSSON - 1", "SPORT CLUB DE SETE BASKET - 1", "15/11/2026", "17:00", "14/11/2026", "En Cours"],
          detailUrl: "afficherDerogation.fbi?idDerogation=CEM2hVj%2BYyDjc%2FV2sYOC6Q%3D%3D&idRencontre=0",
        },
        {
          numero: "16",
          etat: "ACCEPT",
          etatLabel: "Acceptée par les deux associations sportives",
          cells: ["23/09/2026 12:44", "16", "BU11FN23", "SPORT CLUB DE SETE BASKET - 1", "ST GELY BASKETBALL - 1", "03/10/2026", "15:00", "", "Acceptée par les deux associations sportives"],
          detailUrl: "afficherDerogation.fbi?idDerogation=zC%2BwT8kJqRr9&idRencontre=0",
        },
      ];

      // Force artificiellement plusieurs pages sous "Tous les états" (3
      // rencontres non-"A Créer" → 2 pages) — voir la note 4 plus haut.
      const PAGE_SIZE = 2;
      let lastFilteredRows = [];
      let currentPage = 0;

      function rechercherDerogationAjax() {
        const etat = document.querySelector('select[name*="etat" i]').value;
        const numero = document.getElementById("rechercheDerogationFormNumeroRencontre").value.trim();

        // "Tous les états (sauf à créer)" couvre RÉELLEMENT tous les états
        // — voir la note 4 plus haut : le bug n'était jamais le filtre.
        lastFilteredRows = ALL_ROWS.filter((row) => {
          if (etat === "TT" && row.etat === "CREER") return false;
          if (etat !== "TT" && row.etat !== etat) return false;
          if (numero && row.numero !== numero) return false;
          return true;
        });
        currentPage = 0;
        renderCurrentPage();
      }

      function changerPage(delta) {
        const maxPage = Math.max(0, Math.ceil(lastFilteredRows.length / PAGE_SIZE) - 1);
        const next = currentPage + delta;
        if (next < 0 || next > maxPage) return false;
        currentPage = next;
        renderCurrentPage();
        return false;
      }

      function renderCurrentPage() {
        const rows = lastFilteredRows.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
        const tbody = document.querySelector("#getTableauDerogation tbody");
        tbody.innerHTML = "";
        document.getElementById("paginateCurrentPage").textContent = String(currentPage + 1);

        if (rows.length === 0) {
          // Reproduit la ligne "Aucune donnée disponible dans le tableau"
          // que DataTables insère RÉELLEMENT dans <tbody> quand une
          // recherche/page ne renvoie aucun résultat (constaté en
          // production le 2026-09-26 : une recherche par numéro inexistant
          // produisait une ligne "fantôme" numero=null/etat=null que
          // browser-client.ts filtre désormais explicitement, voir son
          // commentaire).
          const emptyTr = document.createElement("tr");
          const emptyTd = document.createElement("td");
          emptyTd.colSpan = 10;
          emptyTd.className = "dataTables_empty";
          emptyTd.textContent = "Aucune donnée disponible dans le tableau";
          emptyTr.appendChild(emptyTd);
          tbody.appendChild(emptyTr);
          document.getElementById("tableauResultats").style.display = "block";
          return;
        }

        for (const row of rows) {
          const tr = document.createElement("tr");

          // Col 0 : checkbox, JAMAIS un lien (structure réelle confirmée).
          const checkboxTd = document.createElement("td");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "FBICheckbox rechercheCheckBox";
          checkboxTd.appendChild(checkbox);
          tr.appendChild(checkboxTd);

          // Chaque cellule de donnée enveloppe son texte dans un vrai <a href>.
          for (const cellText of row.cells) {
            const td = document.createElement("td");
            const div = document.createElement("div");
            div.className = "alignCentrer";
            const a = document.createElement("a");
            a.href = row.detailUrl;
            a.textContent = cellText;
            div.appendChild(a);
            td.appendChild(div);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        document.getElementById("tableauResultats").style.display = "block";
      }
    </script>
  </body>
</html>
