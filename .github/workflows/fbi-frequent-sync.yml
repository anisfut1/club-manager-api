name: FBI frequent sync (dérogations, calendrier, e-Marque)

# Le plan Vercel Hobby limite les crons vercel.json à une exécution par jour
# (voir docs/DEPLOYMENT.md) — /internal/cron/fbi-enqueue, /internal/cron/
# fbi-jobs et /internal/cron/emarque-parse y tournent donc une seule
# fois/jour, ce qui est beaucoup trop lent pour des dérogations à vérifier
# plusieurs fois par jour, pour rattraper plusieurs matchs d'un même weekend
# (constaté le 2026-09-29 : 9 matchs en attente auraient mis 9 jours à être
# traités au rythme d'1 job/jour), ou pour que les stats apparaissent peu
# après le téléchargement du document plutôt qu'à un horaire fixe. GitHub
# Actions (gratuit, hors Vercel) prend le relai ici toutes les 15 minutes —
# exactement la fréquence prévue à l'origine avant la contrainte du plan
# Hobby.
#
# Le parsing (emarque-parse) tourne dans CE MÊME workflow, juste après
# fbi-jobs, plutôt qu'à part sur son propre horaire (retour du club,
# 2026-09-29 : "le parsing doit etre appelé si des emarque ont été
# téléchargés") — sans risque à l'appeler aussi souvent : pas de Playwright
# ni de login FBI ici, juste de l'OCR/PDF local sur ce qui a déjà été
# téléchargé, donc aucun risque de blocage anti-bot FBI contrairement à
# fbi-jobs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      # Synchro FFBB (scores, matchs passés en « joué », calendrier) — retour
      # du club, 2026-10-02 : elle n'était appelée QUE par le cron Vercel
      # quotidien (3h), alors qu'elle est prévue toutes les 15 min
      # (FFBB_SYNC_INTERVAL_MINUTES) : un match du samedi ne passait en
      # « joué » — donc n'entrait dans la file e-Marque — que le dimanche
      # matin. Auto-limitée côté API (un club n'est resynchronisé que s'il est
      # dû) ; un échec ici ne doit jamais empêcher les jobs FBI ci-dessous.
      - name: Synchroniser FFBB (scores, matchs joués)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 240 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/ffbb" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Empile les jobs récurrents (discover_emarque, reconcile_schedule,
      # check_all_derogations) — idempotent : ne duplique jamais un job déjà
      # en attente/en cours pour un club (contrainte unique côté DB).
      - name: Empiler les jobs FBI récurrents
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/fbi-enqueue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Traite UN job de la file (dérogation, calendrier ou téléchargement
      # e-Marque — quel qu'il soit, le plus ancien en premier). Un statut 200
      # avec "claimed": 0 signifie juste qu'il n'y avait rien à traiter, ce
      # n'est jamais une erreur.
      - name: Traiter un job FBI en attente
        run: |
          curl --fail --silent --show-error --max-time 300 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/fbi-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Parse tout document e-Marque téléchargé mais pas encore importé en
      # statistiques — un statut 200 avec "imported": 0 signifie juste qu'il
      # n'y avait rien à parser, ce n'est jamais une erreur.
      - name: Parser les documents e-Marque téléchargés
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -X GET "https://club-manager-api-two.vercel.app/internal/cron/emarque-parse" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
